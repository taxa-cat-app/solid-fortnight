<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мир Такс и Собак 🐶</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, #222222);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        p { font-size: 16px; color: #777; margin-top: 0; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            max-width: 90%;
            width: 320px;
        }
        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="user-greet">Привет! 🐾</h1>
        <p>Посмотри, какая милая собачка!</p>
        
        <img id="dog-pic" src="https://images.unsplash.com/photo-1612536057832-2ff7eed58194?q=80&w=400" alt="Собака">
        
        <button onclick="nextDog()">Показать другую таксу! 🐕</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greet').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}! 🐾`;
        }

        const dogs = [
            "https://images.unsplash.com/photo-1612536057832-2ff7eed58194?q=80&w=400",
            "https://images.unsplash.com/photo-1548199973-03cce0bbc87b?q=80&w=400",
            "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?q=80&w=400",
            "https://images.unsplash.com/photo-1596492784531-6e6eb5ea9993?q=80&w=400"
        ];
        let currentIdx = 0;

        function nextDog() {
            currentIdx = (currentIdx + 1) % dogs.length;
            document.getElementById('dog-pic').src = dogs[currentIdx];
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
